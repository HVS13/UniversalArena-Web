name: Apply structured effect condition support

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/structured-effect-condition-support'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.3 --activate

      - name: Apply narrow source migration
        run: |
          sed -i 's/if core.count("getEffectConditionContext(entry)") != 6:/if core.count("getEffectConditionContext(entry)") != 5:/' scripts/apply-structured-effect-condition-support.py
          sed -i 's/# One definition plus five call sites./# Five effect call sites./' scripts/apply-structured-effect-condition-support.py
          set -o pipefail
          python scripts/apply-structured-effect-condition-support.py 2>&1 | tail -40

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full release gate
        run: pnpm release:check

      - name: Commit verified consumer support
        run: |
          rm scripts/apply-structured-effect-condition-support.py
          rm .github/workflows/apply-structured-effect-condition-support.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Support structured effect conditions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
