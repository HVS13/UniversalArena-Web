name: Apply structured effect condition support

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/structured-effect-condition-support'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.3 --activate

      - name: Apply narrow source migration
        id: migrate
        continue-on-error: true
        run: |
          sed -i 's/if core.count("getEffectConditionContext(entry)") != 6:/if core.count("getEffectConditionContext(entry)") != 5:/' scripts/apply-structured-effect-condition-support.py
          sed -i 's/# One definition plus five call sites./# Five effect call sites./' scripts/apply-structured-effect-condition-support.py
          python scripts/apply-structured-effect-condition-support.py > migration-error.txt 2>&1

      - name: Report migration exception
        if: steps.migrate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'The one-shot migration stopped before committing changes:'
            echo
            echo '```text'
            tail -40 migration-error.txt
            echo '```'
          } > migration-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file migration-comment.md
          exit 1

      - name: Install dependencies
        if: steps.migrate.outcome == 'success'
        run: |
          pnpm install --frozen-lockfile
          npm --prefix server ci

      - name: Run full release gate
        id: release
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        run: pnpm release:check > release-error.txt 2>&1

      - name: Report release gate failure
        if: steps.migrate.outcome == 'success' && steps.release.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'The migrated consumer failed the full release gate:'
            echo
            echo '```text'
            tail -80 release-error.txt
            echo '```'
          } > release-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file release-comment.md
          exit 1

      - name: Commit verified consumer support
        if: steps.migrate.outcome == 'success' && steps.release.outcome == 'success'
        run: |
          rm scripts/apply-structured-effect-condition-support.py
          rm .github/workflows/apply-structured-effect-condition-support.yml
          rm -f migration-error.txt migration-comment.md release-error.txt release-comment.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Support structured effect conditions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
