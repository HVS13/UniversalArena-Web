name: Apply structured effect condition support

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/structured-effect-condition-support'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.3 --activate

      - name: Harden runtime condition validation
        run: python scripts/harden-effect-condition-runtime.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          npm --prefix server ci

      - name: Run full release gate
        run: pnpm release:check

      - name: Commit verified hardening
        run: |
          rm scripts/harden-effect-condition-runtime.py
          rm .github/workflows/apply-structured-effect-condition-support.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden structured condition evaluation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
