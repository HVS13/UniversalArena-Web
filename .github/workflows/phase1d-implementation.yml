name: Phase 1D Implementation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.head_ref == 'agent/host-trusted-network-privacy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply transparent Phase 1D patch
        run: python scripts/phase1d_patch.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gate
        run: pnpm release:check

      - name: Verify patch formatting
        run: git diff --check

      - name: Publish validated product commit
        shell: bash
        run: |
          rm scripts/phase1d_patch.py .github/workflows/phase1d-implementation.yml
          git add \
            apps/client/src/App.tsx \
            apps/client/src/relay-protocol.ts \
            packages/core/src/index.ts \
            packages/core/src/golden.ts \
            server/index.js \
            server/test.js \
            scripts/phase1d_patch.py \
            .github/workflows/phase1d-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: protect guest network state"

          expected=$(printf '%s\n' \
            apps/client/src/App.tsx \
            apps/client/src/relay-protocol.ts \
            packages/core/src/golden.ts \
            packages/core/src/index.ts \
            server/index.js \
            server/test.js | sort)
          actual=$(git diff --name-only origin/main...HEAD | sort)
          test "$actual" = "$expected" || {
            echo "Unexpected final scope:"
            printf '%s\n' "$actual"
            exit 1
          }

          git push origin HEAD:${{ github.event.pull_request.head.ref }}
